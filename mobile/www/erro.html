<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ofertou!</title>
<style>
  :root { --bg: #f4f5f2; --ink: #161b18; --ink-2: #48514c; --brand: #0c8f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1210; --ink: #edf1ee; --ink-2: #b7c0ba; --brand: #2bb673; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  img { width: 120px; height: 120px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--ink-2); margin: 0 0 22px; max-width: 32ch; }
  button { height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: 700 16px system-ui, sans-serif; }
</style>
</head>
<body>
  <main>
    <img src="capi.png" alt="">
    <h1>Sem conexão</h1>
    <p>Não conseguimos carregar as ofertas. Confira a internet e tente de novo.</p>
    <button type="button" onclick="location.href = window.OFERTOU_URL || 'https://tanoofertou.com.br'">Tentar de novo</button>
  </main>
</body>
</html>

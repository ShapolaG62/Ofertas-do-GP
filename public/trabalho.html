<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Área de trabalho — Ofertou!</title>
<link rel="icon" href="/images/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css?v=20261128">
<script src="/js/app-nativo.js?v=20261128"></script>
<script src="/js/dialogo.js?v=20261128"></script>
<script src="/js/voltar.js?v=20261128" data-padrao="/conta" defer></script>
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="/" aria-label="Ofertou! — início">
      <img src="/images/capi-76.png" alt="" width="38" height="38">
      <span class="brand-name">Ofertou<b>!</b></span>
    </a>
    <div class="header-actions">
      <a class="btn btn-sm" href="/ajuda">Guia do usuário</a>
      <a class="btn btn-sm" href="/conta">Minha conta</a>
    </div>
  </div>
</header>

<main class="container trab-page">
  <nav class="trab-menu" aria-label="Área de trabalho">
    <h1>Área de trabalho</h1>
    <p class="muted" id="trab-quem">Carregando…</p>
    <button type="button" data-secao="sac" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19a3 3 0 0 1-3 3h-3"/></svg>SAC<b id="trab-n-sac"></b></button>
    <button type="button" data-secao="moderacao" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4H5.5A1.5 1.5 0 0 1 4 14.5z"/><path d="M9 8l6 5M15 8l-6 5"/></svg>Moderação do chat<b id="trab-n-mod"></b></button>
  </nav>
  <section>
    <iframe class="trab-quadro" id="trab-quadro" title="Área de trabalho" hidden></iframe>
    <div class="panel-card" id="trab-sem-acesso" hidden>
      <h2>Área da equipe</h2>
      <p class="muted">Esta área é da equipe do Ofertou!. Se você deveria ter acesso, peça ao administrador para liberar a função em Painel → Equipe (staff).</p>
      <a class="btn" href="/conta">Ir para Minha conta</a>
    </div>
  </section>
</main>
<script>
// Área de trabalho: mostra só as seções que a pessoa pode usar (SAC e/ou Moderação do chat)
(async () => {
  const $ = s => document.querySelector(s);
  const ENDERECO = { sac: '/sac?embed=1', moderacao: '/moderacao?embed=1' };
  let me;
  try {
    const r = await fetch('/api/trabalho/me', { cache: 'no-store' });
    if (r.status === 401) { location.href = '/conta?voltar=/trabalho'; return; }
    me = await r.json();
  } catch { $('#trab-quem').textContent = 'Sem conexão. Recarregue a página.'; return; }
  const secoes = [me.sac && 'sac', me.moderar && 'moderacao'].filter(Boolean);
  $('#trab-quem').textContent = me.nome ? `Olá, ${me.nome.split(' ')[0]}.` : '';
  if (!secoes.length) { $('#trab-sem-acesso').hidden = false; return; }
  secoes.forEach(s => { document.querySelector(`[data-secao="${s}"]`).hidden = false; });
  $('#trab-n-sac').textContent = me.sac_fila || '';
  $('#trab-n-mod').textContent = me.xingamentos || '';
  const abrir = s => {
    document.querySelectorAll('[data-secao]').forEach(b => b.setAttribute('aria-current', String(b.dataset.secao === s)));
    const q = $('#trab-quadro'); q.hidden = false;
    if (q.dataset.secao !== s) { q.src = ENDERECO[s]; q.dataset.secao = s; }
    history.replaceState(null, '', `#${s}`);
  };
  document.querySelector('.trab-menu').addEventListener('click', e => { const b = e.target.closest('[data-secao]'); if (b) abrir(b.dataset.secao); });
  const pedida = location.hash.slice(1);
  abrir(secoes.includes(pedida) ? pedida : secoes[0]);
  // atualiza os contadores
  setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    try { const d = await (await fetch('/api/trabalho/me', { cache: 'no-store' })).json(); $('#trab-n-sac').textContent = d.sac_fila || ''; $('#trab-n-mod').textContent = d.xingamentos || ''; } catch { /* tenta de novo */ }
  }, 30000);
})();
</script>
</body>
</html>

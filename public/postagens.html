<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="/" aria-label="Ofertou! — início">
      <img src="/images/capi-76.png" alt="" width="38" height="38">
      <span class="brand-name">Ofertou<b>!</b></span>
    </a>
    <div class="header-actions">
      <a class="btn btn-sm" href="/cliente" id="painel-cliente" hidden>Meu painel</a>
      <a class="btn btn-sm" href="/" id="more-link">+ Escolher mais produtos</a>
    </div>
  </div>
</header>

<main class="page">
<div class="container posts-page">
  <div class="posts-head">
    <div>
      <h1>Postagens</h1>
      <p class="posts-sub" id="posts-sub">Carregando…</p>
    </div>
  </div>

  <section class="panel-card posts-auto" aria-labelledby="auto-title">
    <h2 id="auto-title">Postar automaticamente</h2>
    <p class="posts-hint">Marque as redes e clique em postar. Cada produto marcado abaixo é publicado com o texto que está na caixa dele.</p>
    <div class="net-list" id="net-list"></div>
    <p class="posts-hint" id="net-hint" hidden></p>
    <p class="notice" id="afiliado-aviso" hidden></p>
    <div class="posts-actions">
      <button class="btn btn-primary" type="button" id="auto-post">Postar automaticamente</button>
      <button class="btn" type="button" id="auto-stop" hidden>Parar</button>
      <button class="btn" type="button" id="to-queue">Adicionar à fila agendada</button>
      <button class="btn" type="button" id="copy-all">Copiar todos os textos</button>
      <button class="btn" type="button" id="clear-all">Limpar seleção</button>
    </div>
    <div class="post-progress" id="progress" hidden></div>
    <p class="posts-hint" id="agenda-info"></p>
  </section>

  <div class="posts-list" id="posts-list" aria-live="polite"></div>
</div>
</main>

<div class="toast" id="toast" role="status"></div>

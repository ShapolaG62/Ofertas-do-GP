<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<title>Perfil — Ofertou!</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1210">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css?v=20261212">
<script src="/js/tema.js?v=20261212"></script>
<script src="/js/app-nativo.js?v=20261212"></script>
<script src="/js/dialogo.js?v=20261212"></script>
<script src="/js/cosmeticos.js?v=20261212" defer></script>
<script src="/js/capi-minerando.js?v=20261212" defer></script>
<script src="/js/voltar.js?v=20261212" data-padrao="/" defer></script>
<script src="/js/rodape-legal.js?v=20261212" defer></script>
<script src="/js/instalar-app.js?v=20261212" defer></script>
<script src="/js/cookies.js?v=20261212"></script>
<script src="/js/seletor.js?v=20261212" defer></script>
</head>
<body class="pf-body">
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="/" aria-label="Ofertou! — ofertas">
      <img src="/images/capi-76.png" alt="" width="38" height="38">
      <span class="brand-name">Ofertou<b>!</b></span>
    </a>
    <div class="header-actions">
      <a class="btn btn-sm" href="/">Ver ofertas</a>
      <a class="btn btn-sm" href="/perfil" id="pf-meu" hidden>Meu perfil</a>
      <a class="btn btn-sm" href="/ajuda">Guia do usuário</a>
    </div>
  </div>
</header>

<main class="pf-page">
  <div class="pf-capa" id="pf-capa"></div>
  <div class="container pf-wrap">
    <section class="pf-topo" id="pf-topo">
      <p class="pf-carregando">Carregando perfil…</p>
    </section>

    <div class="pf-grid" id="pf-grid" hidden>
      <div class="pf-col">
        <section class="pf-card" id="pf-resumo"></section>
        <section class="pf-card" id="pf-vitrine-card">
          <h2>Vitrine de conquistas</h2>
          <div class="pf-vitrine" id="pf-vitrine"></div>
        </section>
        <section class="pf-card pf-catalogo" id="pf-catalogo" hidden></section>
        <section class="pf-card">
          <div class="pf-card-head"><h2>Conquistas</h2><span class="pf-contagem" id="pf-contagem"></span></div>
          <div id="pf-conquistas"></div>
        </section>
      </div>
      <aside class="pf-col pf-lado">
        <section class="pf-card pf-avisos" id="pf-avisos" hidden></section>
        <section class="pf-card pf-nivel-card" id="pf-nivel"></section>
        <section class="pf-card" id="pf-numeros"></section>
        <section class="pf-card" id="pf-links" hidden></section>
        <section class="pf-card pf-admin" id="pf-admin" hidden></section>
      </aside>
    </div>
  </div>
</main>

<!-- Editor do perfil -->
<dialog class="pf-dialog" id="pf-editor" aria-label="Editar perfil">
  <form class="pf-form" id="pf-form" method="dialog" novalidate>
    <div class="pf-dialog-head">
      <h2>Editar perfil</h2>
      <a class="btn btn-sm pf-loja-btn" href="/cosmeticos" data-abrir-loja><svg class="ico-btn" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 12h-11z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>Loja de cosméticos</a>
      <button class="icon-btn" type="button" data-fechar aria-label="Fechar">✕</button>
    </div>
    <p class="pf-plano-aviso" id="pf-plano-aviso"></p>

    <fieldset>
      <legend>Imagens</legend>
      <div class="pf-imgs">
        <div class="pf-img-box">
          <span class="pf-img-rot">Foto</span>
          <div class="pf-avatar-prev" id="pf-avatar-prev"></div>
          <div class="pf-img-acoes">
            <label class="btn btn-sm"><input type="file" accept="image/jpeg,image/png,image/webp" hidden data-img="avatar">Trocar</label>
            <button class="btn btn-sm" type="button" data-remover="avatar">Remover</button>
          </div>
        </div>
        <div class="pf-img-box pf-img-capa">
          <span class="pf-img-rot">Capa <small id="pf-capa-lock"></small></span>
          <div class="pf-capa-prev" id="pf-capa-prev"></div>
          <div class="pf-img-acoes" id="pf-capa-acoes">
            <label class="btn btn-sm"><input type="file" accept="image/jpeg,image/png,image/webp" hidden data-img="capa">Trocar</label>
            <button class="btn btn-sm" type="button" data-remover="capa">Remover</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Sobre você</legend>
      <div class="pf-campos">
        <label class="field">Nome de exibição <input name="nome" maxlength="40" required></label>
        <label class="field">Título <input name="titulo" maxlength="60" placeholder="Ex.: Caçador de promoções de tecnologia"></label>
        <label class="field">Cidade <input name="cidade" maxlength="60"></label>
        <label class="field">Endereço do perfil <small id="pf-slug-lock"></small>
          <span class="pf-slug"><span id="pf-slug-base">/perfil/</span><input name="slug" maxlength="30"></span></label>
      </div>
      <label class="field">Resumo <small class="hint-inline" id="pf-bio-conta"></small><textarea name="bio" rows="4"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>Cor do perfil</legend>
      <div class="pf-cores" id="pf-cores"></div>
    </fieldset>

    <fieldset>
      <legend>Moldura da foto</legend>
      <div class="pf-molduras" id="pf-molduras"></div>
    </fieldset>

    <fieldset>
      <legend>Vitrine <small class="hint-inline" id="pf-vitrine-conta"></small></legend>
      <p class="hint" style="margin:0 0 8px">Escolha as conquistas em destaque. Sem escolha, mostramos as mais valiosas.</p>
      <div class="pf-escolha-vitrine" id="pf-escolha-vitrine"></div>
    </fieldset>

    <fieldset>
      <legend>Links <small class="hint-inline" id="pf-links-conta"></small></legend>
      <div id="pf-links-edit"></div>
      <button class="btn btn-sm" type="button" id="pf-add-link">+ Adicionar link</button>
    </fieldset>

    <div class="form-msg err" id="pf-msg" hidden></div>
    <div class="pf-dialog-foot">
      <button class="btn" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-primary" type="submit">Salvar perfil</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="/js/perfil.js?v=20261212" defer></script>
<script src="/js/chat-topo.js?v=20261212" defer></script>
<script src="/js/loja-produto.js?v=20261212" defer></script>
</body>
</html>
